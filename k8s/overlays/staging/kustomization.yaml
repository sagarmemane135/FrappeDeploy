apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp-staging

bases:
  - ../../base

images:
  - name: frappe-app
    newName: my-registry.azurecr.io/erp/frappe-app
    newTag: staging-latest

patches:
  # Reduce replicas for cost efficiency in staging
  - target:
      kind: Deployment
      name: frappe-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frappe-worker-default
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
