apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: erp-production

resources:
  - ../../base

images:
  - name: frappe-app
    newName: my-registry.azurecr.io/erp/frappe-app
    newTag: v15.20.0

patches:
  # Increase web replicas in production
  - target:
      kind: Deployment
      name: frappe-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
  # Increase default worker replicas in production
  - target:
      kind: Deployment
      name: frappe-worker-default
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
