apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - storage/pvc-sites.yaml
  - configmap.yaml
  - redis/redis-cache.yaml
  - redis/redis-queue.yaml
  - web/deployment.yaml
  - web/service.yaml
  - web/hpa.yaml
  - workers/worker-default.yaml
  - workers/worker-long.yaml
  - scheduler/deployment.yaml
  - socketio/deployment.yaml
  - socketio/service.yaml
  - ingress/ingress.yaml
  - jobs/job-backup.yaml

# Common Labels applied across all resources
commonLabels:
  app.kubernetes.io/part-of: frappe-bench
  app.kubernetes.io/managed-by: kustomize
