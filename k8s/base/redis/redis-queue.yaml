apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frappe-redis-queue
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-queue
spec:
  serviceName: frappe-redis-queue
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe
      app.kubernetes.io/component: redis-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: redis-queue
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - "1gb"
            - --maxmemory-policy
            - noeviction
            - --save
            - "900"
            - "1"
            - --save
            - "300"
            - "10"
            - --appendonly
            - "yes"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-queue-data
              mountPath: /data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-queue-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-redis-queue
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-queue
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-queue
