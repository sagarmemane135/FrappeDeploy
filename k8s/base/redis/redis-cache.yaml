apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-redis-cache
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe
      app.kubernetes.io/component: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: redis-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 600Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frappe-redis-cache
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: redis-cache
