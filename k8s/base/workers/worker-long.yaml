apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-worker-long
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: worker-long
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe
      app.kubernetes.io/component: worker-long
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: worker-long
    spec:
      # Extended grace period to allow 1500s Frappe long jobs to complete safely before SIGKILL
      terminationGracePeriodSeconds: 1800
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc
        - name: config-volume
          configMap:
            name: frappe-bench-config
      containers:
        - name: worker
          image: frappe-app:latest
          command: ["bench", "worker", "--queue", "long"]
          envFrom:
            - configMapRef:
                name: frappe-bench-config
            - secretRef:
                name: frappe-secrets
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
            - name: config-volume
              mountPath: /home/frappe/frappe-bench/sites/common_site_config.json
              subPath: common_site_config.json
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
