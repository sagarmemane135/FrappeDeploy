apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-worker-default
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: worker-default
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe
      app.kubernetes.io/component: worker-default
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: worker-default
    spec:
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc
        - name: config-volume
          configMap:
            name: frappe-bench-config
      containers:
        - name: worker
          image: frappe-app:latest
          command: ["bench", "worker", "--queue", "short,default"]
          envFrom:
            - configMapRef:
                name: frappe-bench-config
            - secretRef:
                name: frappe-secrets
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
            - name: config-volume
              mountPath: /home/frappe/frappe-bench/sites/common_site_config.json
              subPath: common_site_config.json
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: 1500m
              memory: 2Gi
