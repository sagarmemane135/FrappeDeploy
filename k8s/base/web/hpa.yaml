apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frappe-web-hpa
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frappe-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
