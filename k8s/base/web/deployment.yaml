apiVersion: apps/v1
kind: Deployment
metadata:
  name: frappe-web
  labels:
    app.kubernetes.io/name: frappe
    app.kubernetes.io/component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frappe
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frappe
        app.kubernetes.io/component: web
    spec:
      volumes:
        - name: sites-storage
          persistentVolumeClaim:
            claimName: frappe-sites-pvc
        - name: config-volume
          configMap:
            name: frappe-bench-config
      containers:
        - name: web
          image: frappe-app:latest
          command:
            - gunicorn
            - -b
            - 0.0.0.0:8000
            - --workers
            - "4"
            - --threads
            - "2"
            - --timeout
            - "120"
            - --max-requests
            - "1000"
            - --max-requests-jitter
            - "100"
            - frappe.app:application
            - --preload
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: frappe-bench-config
            - secretRef:
                name: frappe-secrets
          volumeMounts:
            - name: sites-storage
              mountPath: /home/frappe/frappe-bench/sites
            - name: config-volume
              mountPath: /home/frappe/frappe-bench/sites/common_site_config.json
              subPath: common_site_config.json
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/method/frappe.ping
              port: 8000
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
